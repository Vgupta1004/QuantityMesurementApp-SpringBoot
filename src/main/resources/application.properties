# -- Application ----------------------------------------------
spring.application.name=quantity-measurement-app
server.port=8080

# -- JPA / Hibernate-------------------------------------------
# H2 speaks a slightly different SQL dialect than MySQL.
# This tells Hibernate which flavour to use.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# update = create/alter tables automatically from @Entity classes.
# Never use this in production - use "validate" instead.
spring.jpa.hibernate.ddl-auto=update

# Print the SQL Hibernate generates - useful for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -- H2 In-Memory Database ------------------------------------
# The browser console for H2 - lets you run SQL queries live
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# This is the connection string H2 uses. "mem:" means in-memory
# (data is lost when the app stops - fine for dev and tests)
spring.datasource.url=jdbc:h2:mem:quantitymeasurementdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# -- Connection Pool (HikariCP) -------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# -- Logging --------------------------------------------------
# See our app's logs in detail, see SQL queries
logging.level.com.seveneleven.quantitymeasurement=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{5}:%line - %msg%n

# -- Swagger / OpenAPI -----------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# -- Actuator -------------------------------------------------
# Expose health, metrics, and info endpoints
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true